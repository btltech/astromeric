name: Deploy Production (Railway)

# Deploys the backend only. The website (Cloudflare Pages) is deployed manually
# with wrangler (`npm run deploy`, see docs/deployment/DEPLOY.md). Frontend
# build/lint checks still run in ci.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          railway up -d --service astromeric-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
