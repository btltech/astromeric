name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Lint code (ruff/black)
        run: |
          pip install --upgrade pip
          # black is pinned to the version in .pre-commit-config.yaml so CI and the
          # commit hook agree; newer black releases restyle unchanged files.
          pip install ruff black==23.9.1
          ruff check backend/app backend/tests
          black --check backend/app backend/tests
      - name: Run backend tests
        run: |
          pytest -q backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: |
          npm ci
      - name: Lint frontend
        run: |
          npm ci
          npm run format -- --check
          npm run lint:ci
      - name: Build frontend
        run: |
          npm run build
        env:
          VITE_API_URL: https://astromeric-backend-prod.railway.app
