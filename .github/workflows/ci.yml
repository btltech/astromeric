name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Lint code (ruff/black)
        run: |
          pip install --upgrade pip
          # black is pinned to the version in .pre-commit-config.yaml so CI and the
          # commit hook agree; newer black releases restyle unchanged files.
          pip install ruff black==23.9.1
          ruff check backend/app backend/tests
          black --check backend/app backend/tests
      - name: Run backend tests
        run: |
          pytest -q backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: |
          npm ci
      - name: Lint frontend
        run: |
          npm ci
          npm run format -- --check
          npm run lint:ci
      - name: Build frontend
        run: |
          npm run build
        env:
          VITE_API_URL: https://astromeric-backend-prod.railway.app

  ios-localization:
    # Cheap Linux check: a key the app cannot resolve is drawn on screen
    # verbatim, so it must never reach main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate iOS localization keys
        run: python3 scripts/check_ios_localization.py

  ios-tests:
    # The iOS app is what ships, so it has to compile and pass its tests here,
    # not only on a developer's machine.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available | grep -Eo '\(([0-9A-F-]{36})\)' | head -1 | tr -d '()')
          if [ -z "$udid" ]; then echo "no simulator available"; exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"
      - name: Build and test iOS app
        run: |
          set -o pipefail
          xcodebuild test \
            -project AstroNumeric-iOS/AstroNumeric.xcodeproj \
            -scheme AstroNumeric \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:AstroNumericTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES
